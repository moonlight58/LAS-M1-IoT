<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT sensor visualisation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .chart-container {
        width: 85%;
        max-width: 800px;
        margin: 20px auto;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">IoT Dashboard</h2>

    <div class="chart-container">
      <canvas id="tempHumChart"></canvas>
    </div>

    <div class="chart-container">
      <canvas id="accelChart"></canvas>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Chart ESP32
        const ctxTemp = document
          .getElementById("tempHumChart")
          .getContext("2d");
        const tempHumChart = new Chart(ctxTemp, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Temperature (°C)",
                borderColor: "#ff4d4d",
                backgroundColor: "#ff4d4d",
                data: [],
                fill: false,
              },
              {
                label: "Humidity (%)",
                borderColor: "#3399ff",
                backgroundColor: "#3399ff",
                data: [],
                fill: false,
              },
            ],
          },
          options: { responsive: true, animation: false },
        });

        // Chart Arduino Nano
        const ctxAccel = document.getElementById("accelChart").getContext("2d");
        const accelChart = new Chart(ctxAccel, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "X Axis",
                borderColor: "#e60073",
                backgroundColor: "#e60073",
                data: [],
                fill: false,
              },
              {
                label: "Y Axis",
                borderColor: "#7300e6",
                backgroundColor: "#7300e6",
                data: [],
                fill: false,
              },
              {
                label: "Z Axis",
                borderColor: "#00cc66",
                backgroundColor: "#00cc66",
                data: [],
                fill: false,
              },
            ],
          },
          options: { responsive: true, animation: false },
        });

        async function chargerHistorique() {
          try {
            // Accelerometer (Arduino Nano)
            const nanoRes = await fetch("/nano_data");
            const nanoRows = await nanoRes.json();

            if (Array.isArray(nanoRows)) {
              nanoRows.forEach((row) => {
                const timeStr = row.datetime
                  ? new Date(row.datetime).toLocaleTimeString()
                  : new Date().toLocaleTimeString();
                accelChart.data.labels.push(timeStr);
                accelChart.data.datasets[0].data.push(row.x);
                accelChart.data.datasets[1].data.push(row.y);
                accelChart.data.datasets[2].data.push(row.z);
              });
              accelChart.update();
            }

            // Temperature & Humidity (ESP32)
            const espRes = await fetch("/esp_data");
            const espJson = await espRes.json();
            const espRows = espJson.data || espJson;

            if (Array.isArray(espRows)) {
              espRows.forEach((row) => {
                const timeStr = row.datetime
                  ? new Date(row.datetime).toLocaleTimeString()
                  : new Date().toLocaleTimeString();
                tempHumChart.data.labels.push(timeStr);
                tempHumChart.data.datasets[0].data.push(row.temperature);
                tempHumChart.data.datasets[1].data.push(row.humidity);
              });
              tempHumChart.update();
            }
          } catch (err) {
            console.error("Error while loading the history :", err);
          }
        }

        // Launch of the history loading at startup
        chargerHistorique();

        // update in real-time with WebSocket

        const ws = new WebSocket(`ws://${window.location.host}`);

        ws.onmessage = (event) => {
          const message = JSON.parse(event.data);
          const timeNow = new Date().toLocaleTimeString();

          if (message.type === "esp32") {
            tempHumChart.data.labels.push(timeNow);
            tempHumChart.data.datasets[0].data.push(
              message.payload.temperature,
            );
            tempHumChart.data.datasets[1].data.push(message.payload.humidity);

            if (tempHumChart.data.labels.length > 20) {
              tempHumChart.data.labels.shift();
              tempHumChart.data.datasets.forEach((d) => d.data.shift());
            }
            tempHumChart.update();
          } else if (message.type === "nano") {
            accelChart.data.labels.push(timeNow);
            accelChart.data.datasets[0].data.push(message.payload.x);
            accelChart.data.datasets[1].data.push(message.payload.y);
            accelChart.data.datasets[2].data.push(message.payload.z);

            if (accelChart.data.labels.length > 20) {
              accelChart.data.labels.shift();
              accelChart.data.datasets.forEach((d) => d.data.shift());
            }
            accelChart.update();
          }
        };
      });
    </script>
  </body>
</html>
