<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT sensor visualisation</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .chart-container {
        width: 85%;
        max-width: 800px;
        margin: 20px auto;
      }
      #status {
        text-align: center;
        font-size: 0.9em;
        color: #888;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center">IoT Dashboard</h2>
    <p id="status">Connexion…</p>

    <div class="chart-container">
      <canvas id="tempHumChart"></canvas>
    </div>

    <div class="chart-container">
      <canvas id="accelChart"></canvas>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const MAX_POINTS = 20;

        const makeDataset = (label, color) => ({
          label,
          borderColor: color,
          backgroundColor: color,
          data: [],
          fill: false,
        });

        // Chart ESP32
        const tempHumChart = new Chart(
          document.getElementById("tempHumChart").getContext("2d"),
          {
            type: "line",
            data: {
              labels: [],
              datasets: [
                makeDataset("Temperature (°C)", "#ff4d4d"),
                makeDataset("Humidity (%)", "#3399ff"),
              ],
            },
            options: { responsive: true, animation: false },
          },
        );

        // Chart Arduino Nano
        const accelChart = new Chart(
          document.getElementById("accelChart").getContext("2d"),
          {
            type: "line",
            data: {
              labels: [],
              datasets: [
                makeDataset("X Axis", "#e60073"),
                makeDataset("Y Axis", "#7300e6"),
                makeDataset("Z Axis", "#00cc66"),
              ],
            },
            options: { responsive: true, animation: false },
          },
        );

        // Ajoute un point (valeurs = une par dataset) et garde MAX_POINTS points
        function addPoint(chart, label, values) {
          chart.data.labels.push(label);
          values.forEach((v, i) => chart.data.datasets[i].data.push(v));
          while (chart.data.labels.length > MAX_POINTS) {
            chart.data.labels.shift();
            chart.data.datasets.forEach((d) => d.data.shift());
          }
        }

        const fmtTime = (iso) =>
          (iso ? new Date(iso) : new Date()).toLocaleTimeString();

        async function chargerHistorique() {
          try {
            // Accelerometer (Arduino Nano)
            const nanoRes = await fetch("/nano_data");
            const nanoRows = await nanoRes.json();
            if (Array.isArray(nanoRows)) {
              nanoRows.forEach((r) =>
                addPoint(accelChart, fmtTime(r.datetime), [r.x, r.y, r.z]),
              );
              accelChart.update();
            }

            // Temperature & Humidity (ESP32)
            const espRes = await fetch("/esp_data");
            const espJson = await espRes.json();
            const espRows = espJson.data || espJson;
            if (Array.isArray(espRows)) {
              espRows.forEach((r) =>
                addPoint(tempHumChart, fmtTime(r.datetime), [
                  r.temperature,
                  r.humidity,
                ]),
              );
              tempHumChart.update();
            }
          } catch (err) {
            console.error("Error while loading the history :", err);
          }
        }

        // ---- Temps réel via WebSocket (avec reconnexion automatique) ----
        const statusEl = document.getElementById("status");

        function connectWS() {
          const proto = location.protocol === "https:" ? "wss" : "ws";
          const ws = new WebSocket(`${proto}://${location.host}`);

          ws.onopen = () => (statusEl.textContent = "Temps réel : connecté");

          ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            const timeNow = new Date().toLocaleTimeString();
            const p = message.payload;

            if (message.type === "esp32") {
              addPoint(tempHumChart, timeNow, [p.temperature, p.humidity]);
              tempHumChart.update();
            } else if (message.type === "nano") {
              addPoint(accelChart, timeNow, [p.x, p.y, p.z]);
              accelChart.update();
            }
          };

          ws.onclose = () => {
            statusEl.textContent = "Déconnecté, nouvelle tentative…";
            setTimeout(connectWS, 2000);
          };
        }

        chargerHistorique().then(connectWS);
      });
    </script>
  </body>
</html>
